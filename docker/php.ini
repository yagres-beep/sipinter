; Batas unggah berkas dinaikkan supaya cocok dengan aturan validasi aplikasi
; (bukti capaian/dukung PDF maks 10MB, lihat max:10240 di App\Livewire\PengisianKegiatan).
; Image php:8.2-fpm-bookworm TIDAK menyertakan php.ini aktif secara default, jadi
; tanpa file ini PHP memakai batas bawaan upload_max_filesize=2M/post_max_size=8M —
; jauh di bawah 10MB yang dijanjikan ke pengguna di form, sehingga unggahan berkas
; yang sah (3-10MB) gagal walau lolos validasi mimes/max di sisi Laravel.
upload_max_filesize = 12M
post_max_size = 20M

; --- Pengaturan produksi ---
; Tanpa php.ini, nilai bawaan PHP adalah display_errors=On: error fatal yang terjadi
; sebelum Laravel sempat menangani (mis. parse error) bisa tampil mentah ke pengguna
; lengkap dengan path server. Error tetap tercatat ke log container (stderr).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
memory_limit = 256M
max_execution_time = 180

; OPcache — kode tidak berubah selama container hidup (image di-build ulang tiap
; deploy), jadi pemeriksaan timestamp berkas dimatikan untuk kinerja maksimal.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
realpath_cache_size = 4096K
realpath_cache_ttl = 600
